name: maclean
options:
  bundleIdPrefix: com.ethon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  maclean:
    type: application
    platform: macOS
    sources:
      - path: maclean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethon.maclean
        # 固定自签名证书：签名身份跨构建稳定，辅助功能授权一次永久有效。
        # （ad-hoc 签名每次重建指纹变化，会导致 TCC 授权失效，必须重新授予）
        CODE_SIGN_IDENTITY: "maclean-dev"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: maclean/Info.plist
      properties:
        CFBundleDisplayName: maclean
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication

  macleanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: maclean
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/maclean.app/Contents/MacOS/maclean"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  maclean:
    build:
      targets:
        maclean: all
    test:
      targets:
        - macleanTests
